<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - MealMatch</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .header { background: #2ecc71; color: white; padding: 20px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .logout-btn { background: #e74c3c; color: white; }
        .box { background: white; padding: 20px; margin-top: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        tr:hover { background: #f9f9f9; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <h2>🍽️ MealMatch</h2>
        <div>
            Welcome, <span id="usernameDisplay">User</span>!
            <button class="logout-btn" id="logoutBtn" style="margin-left:15px;">Log Out</button>
        </div>
    </div>

    <div class="box">
        <h3>Dietary Preference</h3>
        <select id="dietPref" style="padding: 8px;">
            <option value="none">No Preference</option>
            <option value="Vegetarian">Vegetarian</option>
            <option value="Vegan">Vegan</option>
            <option value="Gluten-Free">Gluten-Free</option>
        </select>
        <button onclick="savePref()" style="background: #3498db; color: white;">Save</button>
    </div>

    <div class="box">
        <h3>Recipes</h3>
        <input type="text" id="searchBox" placeholder="Search recipes..." onkeyup="loadRecipes()" style="padding: 8px; width: 200px;">
        <select id="filterCategory" onchange="loadRecipes()" style="padding: 8px;">
            <option value="All">All Categories</option>
            <option value="Vegetarian">Vegetarian</option>
            <option value="Vegan">Vegan</option>
            <option value="Gluten-Free">Gluten-Free</option>
        </select>

        <table>
            <thead>
                <tr><th>Name</th><th>Category</th><th>Calories</th></tr>
            </thead>
            <tbody id="recipeBody"></tbody>
        </table>

        <!-- The Pie Chart Container -->
        <canvas id="macroChart" style="max-width: 400px; margin-top: 20px; display: none;"></canvas>
    </div>

    <script>
        let myChart = null;

        async function checkLogin() {
            const res = await fetch('/api/auth/me');
            const data = await res.json();
            if (!data.loggedIn) window.location.href = 'login.html';
            else document.getElementById('usernameDisplay').innerText = data.username;
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = 'login.html';
        });

        async function savePref() {
            const pref = document.getElementById('dietPref').value;
            await fetch('/api/auth/preference', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ preference: pref })
            });
            alert('Preference Saved!');
        }

        async function loadRecipes() {
            const filter = document.getElementById('filterCategory').value;
            const search = document.getElementById('searchBox').value;
            const res = await fetch(`/api/recipes?category=${filter}&search=${search}`);
            const meals = await res.json();
            
            const tbody = document.getElementById('recipeBody');
            tbody.innerHTML = ''; 

            meals.forEach(meal => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${meal.name}</td><td>${meal.category}</td><td>${meal.calories}</td>`;
                tr.onclick = () => showChart(meal);
                tbody.appendChild(tr);
            });
        }

        // US-06 & 07: Pie Chart
        function showChart(meal) {
            document.getElementById('macroChart').style.display = 'block';
            const ctx = document.getElementById('macroChart').getContext('2d');
            if (myChart) myChart.destroy(); 

            myChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Protein', 'Carbs', 'Fat'],
                    datasets: [{ data: [meal.protein, meal.carbs, meal.fat], backgroundColor: ['#e74c3c', '#3498db', '#f1c40f'] }]
                },
                options: { plugins: { title: { display: true, text: meal.name + ' Macros' } } }
            });
        }

        checkLogin().then(() => loadRecipes());
    </script>
</body>
</html>
